name: CI Quality Gate

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest

    # Ephemeral database used only inside this job: trust auth, so no password exists.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dashnode_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/dashnode_ci
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Secret scan (tracked files)
        run: python scripts/scan_secrets.py --all

      - name: Ruff Lint Check
        run: ruff check .

      - name: Ruff Code Formatting Check
        run: ruff format --check .

      - name: Mypy Strict Type Check
        run: mypy .

      - name: Architectural Contracts Enforcement (Import Linter)
        run: lint-imports

      - name: Migrations (offline SQL + real upgrade + downgrade round trip)
        run: |
          alembic upgrade head --sql > /dev/null
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Test Suite, integration on PostgreSQL and coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

name: CI Quality Gate (Trunk)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint Check
        run: ruff check .

      - name: Ruff Code Formatting Check
        run: ruff format --check .

      - name: Mypy Strict Type Check
        run: mypy .

      - name: Architectural Contracts Enforcement (Import Linter)
        run: lint-imports

      - name: Test Suite & Domain Coverage
        run: |
          pytest tests/unit tests/application tests/api --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Alembic Migration DDL Generation
        run: alembic upgrade head --sql

version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dashnode
      POSTGRES_PASSWORD: dashnode
      POSTGRES_DB: dashnode
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashnode"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgresql+psycopg://dashnode:dashnode@db:5432/dashnode
      - JWT_SECRET=${JWT_SECRET:-super_secret_development_key_only_change_in_prod}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# Local development stack. All secrets come from `.env` (generate it with
# `python scripts/generate_env.py`); nothing sensitive is stored in this file.
name: dashnode-backend

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run python scripts/generate_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/generate_env.py first}
      POSTGRES_DB: ${POSTGRES_DB:-dashnode}
    ports:
      # Loopback only: the database is never exposed to the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      # Inside the network the database host is the service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dashnode}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default:
        aliases:
          - dashnode-api

networks:
  default:
    # Fixed name so the frontend stack can attach to it and reach the API by alias.
    name: dashnode-net

volumes:
  postgres_data:

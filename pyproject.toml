[project]
name = "dashnode-backend"
version = "1.0.0"
description = "DashNode Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "rapidfuzz>=3.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*", "tests*", "docs*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.9.0",
    "ruff>=0.3.4",
    "import-linter>=2.0.0",
    "hypothesis>=6.100.0",
    "pip-audit>=2.7.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ", "T20", "N", "SIM", "PT", "RUF", "TID251"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "TID251"]
"app/cli/*" = ["T201", "TID251"]
"app/modules/auth/domain/messages.py" = ["S105"]  # literal user-facing texts, not secrets
"scripts/*" = ["T201", "S105", "S106", "S603", "S607", "TID251", "E402", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use Clock port instead (HC-09)"
"datetime.datetime.utcnow".msg = "Use Clock port instead (HC-09)"
"uuid.uuid4".msg = "Use IdGenerator port instead (HC-09)"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
exclude = ["migrations/"]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "BR-1: Routers do not access DB/ORM directly"
type = "forbidden"
source_modules = ["app.modules.*.api"]
forbidden_modules = ["sqlalchemy", "app.modules.*.infrastructure", "app.shared.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "BR-2: Domain purity"
type = "forbidden"
source_modules = ["app.modules.*.domain", "app.shared.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic_settings"]

[[tool.importlinter.contracts]]
name = "BR-4: Module isolation"
type = "independence"
modules = ["app.modules.auth", "app.modules.projects", "app.modules.tasks", "app.modules.notifications", "app.modules.availability", "app.modules.backlog", "app.modules.kanban", "app.modules.documentation", "app.modules.ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a real PostgreSQL server (TEST_POSTGRES_URL)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
